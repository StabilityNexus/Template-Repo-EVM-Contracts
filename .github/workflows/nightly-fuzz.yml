name: Nightly Fuzz

on:
  # Run deep fuzzing outside normal PR latency budgets.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Deep Fuzz and Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          # The gate below needs the commit history, not just the tip.
          fetch-depth: 0

      # A nightly run on an unchanged main only burns minutes; a manual dispatch always runs.
      - name: Skip unless main changed in the last 24h
        id: gate
        run: |
          if [ -z "$(git log origin/main --since=24.hours --format=%H)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Foundry
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.5.1"
          
      - name: Run deep fuzz tests
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: forge test --fuzz-runs 10000 --invariant-runs 1000 -vvv
